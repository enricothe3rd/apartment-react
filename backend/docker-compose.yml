services:
  postgres:
    image: postgres:16-alpine
    container_name: property-management-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: property_management
    ports:
      - "5432:5432"
    volumes:
      - property_management_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d property_management"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  property_management_postgres:
